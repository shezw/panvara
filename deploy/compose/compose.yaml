# Panvara
# deploy/compose/compose.yaml    2026-07-14
#
# @link    : https://github.com/shezw/panvara
# @author  : shezw
# @email   : hello@shezw.com

name: ${PANVARA_COMPOSE_PROJECT:-panvara}

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: panvara
      POSTGRES_USER: panvara
      POSTGRES_PASSWORD: panvara-dev
    ports:
      - "127.0.0.1:${PANVARA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - panvara-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panvara -d panvara"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  panvara-postgres:
