#
# @link    : https://github.com/shezw/panvara
# @author  : shezw
# @email   : hello@shezw.com

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current:
    name: Go 1.26 pull-request gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - run: make verify

  previous:
    name: Go 1.25 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: false
      - run: go vet ./...
      - run: go test -shuffle=on -count=1 ./...
      - run: go build -trimpath ./cmd/panvara
