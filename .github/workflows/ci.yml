# Panvara
# .github/workflows/ci.yml    2026-07-14
#
# @link    : https://github.com/shezw/panvara
# @author  : shezw
# @email   : hello@shezw.com

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current:
    name: Go 1.26 pull-request gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: make verify

  integration:
    name: PostgreSQL 18.4 integration and Server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PANVARA_TEST_DATABASE_URL: postgres://panvara:panvara-test@127.0.0.1:5432/panvara_test?sslmode=disable
      PANVARA_REQUIRE_DOCKER: "1"
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: panvara_test
          POSTGRES_USER: panvara
          POSTGRES_PASSWORD: panvara-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panvara -d panvara_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: make test-e2e

  previous:
    name: Go 1.25 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - run: go vet ./...
      - run: go test -shuffle=on -count=1 ./...
      - run: go build -trimpath ./cmd/panvara
